name: CI Fast (PR)

on:
  push:
    branches: [main, develop]
  pull_request:
    # git flow 下 feature/hotfix 的合并目标既可能是 develop 也可能是 main，
    # 两者都要跑门禁——否则合并到 develop 的 PR 完全没有 CI 把关。
    branches: [main, develop]

# 同一分支上新的 push 取消仍在跑的旧 run，避免堆积
concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只需要读代码
permissions:
  contents: read

env:
  # 测试用的假凭据（非机密），集中在此避免各 job 重复
  SECRET_KEY: test-secret-key-for-pytest-only-32chars!
  JWT_SECRET_KEY: test-jwt-secret-key-for-pytest-only!
  DEEPSEEK_API_KEY: test-key
  EMBEDDING_API_KEY: test-key
  ENABLE_RATE_LIMIT: 'false'
  ENABLE_MONITORING: 'false'
  # 这些服务在 fast 档不启动，仅提供配置值让 app.core.config 能加载
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  ELASTICSEARCH_HOSTS: '["http://localhost:9200"]'
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  MINIO_ENDPOINT: localhost:9000

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        include:
          # 只有 3.12 采集覆盖率并应用 fail_under 门禁；3.11 的职责是证明
          # 代码在该版本上能跑，不参与覆盖率判定（避免版本间微小差异卡住 PR）。
          - python-version: '3.12'
            coverage: 'true'

    env:
      DATABASE_URL: sqlite+aiosqlite:///test.db

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 缓存改由 setup-uv 接管（原 ~/.cache/pip 缓存步骤随之移除——迁移后不再有 pip 写入）。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements*.txt'

      # --system：直接装进 actions/setup-python 为矩阵选定的解释器，无需建 venv/激活。
      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/ tests/ scripts/

      # 静态安全扫描前置到 PR：此前只在 nightly 跑，而 nightly 已连续红 ≥11 天，
      # 等于这条门禁事实上不存在。bandit 已在 requirements-dev.txt，无需额外安装。
      # 只阻断 medium+；low 档留给 nightly 仅报告。
      - name: Static security scan (bandit, medium+)
        working-directory: backend
        run: bandit -r app/ -ll

      - name: Migration smoke test (SQLite)
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/check_schema.py

      # 覆盖率只在 3.12 腿启用（见 matrix.include）：3.11 腿不带 --cov，
      # pyproject.toml 的 fail_under 门禁因此在它上面不会触发（不采集就不判定）。
      - name: Run fast tests (unit + behavior + API security regressions)
        working-directory: backend
        env:
          COVERAGE: ${{ matrix.coverage }}
        run: |
          # 用 bash 数组而不是字符串变量：`pytest $ARGS` 会被 shellcheck 判为
          # SC2086（未加引号的变量会做词分割/通配），而 `pytest "$ARGS"` 又会把
          # 整串当成单个参数、pytest 找不到路径。数组是唯一同时满足两者的写法。
          ARGS=(tests/unit/ tests/behavior/ tests/integration/test_security_regressions.py tests/integration/test_api_auth.py -v --tb=short)
          if [ "$COVERAGE" = "true" ]; then
            python -m pytest "${ARGS[@]}" --cov=app --cov-report=xml --cov-report=term
          else
            python -m pytest "${ARGS[@]}"
          fi

      # 只有 3.12 腿产出 backend/coverage.xml（3.11 腿不采集覆盖率）。
      - name: Upload coverage to Codecov
        if: matrix.coverage == 'true'
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # 迁移必须在真实 MySQL 上验证：SQLite 不校验外键目标表是否存在，
  # 001 曾因此在 SQLite 上假绿、在 MySQL 上 1824 失败。
  migration-mysql:
    name: Migration (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        # 与 docker-compose.yml 的 MySQL 启动参数一致。CI 要模拟生产的“行为”，
        # 而不只是连上同一个端口——否则测的是一个生产里不存在的配置。
        # 仓库约定的 canonical collation 见 CHANGELOG。
        command: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 缓存改由 setup-uv 接管（原 ~/.cache/pip 缓存步骤随之移除——迁移后不再有 pip 写入）。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements*.txt'

      # --system：直接装进 actions/setup-python 选定的解释器，无需建 venv/激活。
      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      # 两个库共用同一个 MySQL service：一条走 Alembic（未来路径），
      # 一条走 create_all（生产当前实际路径），避免另起 job 的额外开销。
      - name: Create test databases
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE test_alembic;"
          mysql -h 127.0.0.1 -uroot -e "CREATE DATABASE test_create_all;"

      - name: Alembic path — upgrade / downgrade / upgrade
        working-directory: backend
        env:
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/test_alembic
        run: |
          echo "::group::alembic upgrade head"
          alembic upgrade head
          python scripts/check_schema.py --report-columns
          echo "::endgroup::"

          echo "::group::alembic downgrade base"
          alembic downgrade base
          echo "::endgroup::"

          echo "::group::alembic upgrade head（round-trip：验证迁移可逆、可重建）"
          alembic upgrade head
          python scripts/check_schema.py --report-columns
          echo "::endgroup::"

      # 生产实际调用的是 init_db() → Base.metadata.create_all
      # （app/core/database.py）。只验证 Alembic 会漏掉生产路径上的方言问题。
      - name: create_all path — production schema bootstrap
        working-directory: backend
        env:
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/test_create_all
        run: |
          python -c "import asyncio; from app.core.database import init_db; asyncio.run(init_db())"
          python scripts/check_schema.py --create-all --report-columns

  # Integration 只在 develop 的推送（即合并）上跑，且必须等快速门禁通过。
  # 语义：integration 永远验证「一个已通过 PR 门禁的 develop 提交」。
  #
  # 为什么不用 workflow_run 监听 CI Fast：该触发要求 workflow 文件存在于默认分支
  # （本仓库的 main 只在发版时更新），会让 integration 的定义无法跟随 develop 演进。
  # 用同 workflow 内的 needs + if 表达同一语义，且无此约束。
  integration:
    name: Integration Tests (MySQL + Redis)
    needs: [backend-tests, migration-mysql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 只保留 3.12 一条腿：3.11 的兼容性已由 backend-tests 的 matrix 在每个 PR 上
        # 覆盖；integration 验证的是真实服务行为，与 Python 小版本无关，
        # 跑两条腿会让每次合并多花约 95 秒。
        python-version: ['3.12']

    # services / job 级 env / 各 step 自 ci-nightly.yml 的 backend-integration job
    # 搬运（有意的重复：对单人项目，重复一份 job 定义比 reusable workflow 的间接层更简单）。
    services:
      mysql:
        image: mysql:8.0
        # 与 docker-compose.yml 的 MySQL 启动参数一致。CI 要模拟生产的“行为”，
        # 而不只是连上同一个端口——否则测的是一个生产里不存在的配置。
        # 仓库约定的 canonical collation 见 CHANGELOG。
        command: >-
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/test_db
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      ELASTICSEARCH_HOSTS: '["http://localhost:9200"]'
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      MINIO_ENDPOINT: localhost:9000
      # nightly 里这行在工作流级 env，这里下移到 job 级（ci-fast 的其它 job 不需要它）。
      # 不加它，tests/integration 下 3 个带 skipif(RUN_INTEGRATION != "1") 的文件会整组跳过。
      RUN_INTEGRATION: '1'

    steps:
      # checkout 不复刻 nightly 的 ref: ${{ inputs.ref || 'develop' }}：那一行是为
      # schedule 只在默认分支触发准备的，且 inputs 上下文只存在于 workflow_dispatch /
      # workflow_call。这里默认签出即 github.sha —— 本次 push 的提交本身，
      # 与 backend-tests 验的是同一个 commit，比按分支名二次解析更精确。
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 与 backend-tests / migration-mysql 用同一套安装方式（uv），
      # 避免同一文件里混用 pip / uv 两种路径。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'backend/requirements*.txt'

      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Migration smoke test on real MySQL
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/check_schema.py

      - name: Run integration tests
        working-directory: backend
        run: |
          python -m pytest tests/integration/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend,integration
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # ESLint 9+ 移除了 --ext（改由 flat config 的 files 决定范围）
        run: npx eslint .

      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Run tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: frontend/coverage/
          flags: frontend
          fail_ci_if_error: false

      - name: Build
        working-directory: frontend
        run: npm run build

  # 校验 workflow 文件本身：表达式、needs 引用、shellcheck run 块
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          # TODO(actionlint): 临时兼容,不是永久设计。
          # actionlint 1.7.12 的内置 schema 还没有 2026-04 GA 的 services.command /
          # entrypoint，会把下面这行报成错误——属误报。
          # 依据: https://github.blog/changelog/2026-04-02-github-actions-early-april-2026-updates/
          #       （"Customizing entrypoints for service containers"）
          # actionlint 更新 schema 后即可删除这条 -ignore。
          # 正则用 `.` 代替字面双引号：结果等价，且 PowerShell 下也不会因引号传递而失效。
          ./actionlint -color \
            -ignore 'unexpected key .command. for .services. section'

  ci-pass:
    name: CI Pass
    if: always()
    needs: [backend-tests, migration-mysql, frontend-tests, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          failed=0
          for r in \
            "backend-tests=${{ needs.backend-tests.result }}" \
            "migration-mysql=${{ needs.migration-mysql.result }}" \
            "frontend-tests=${{ needs.frontend-tests.result }}" \
            "workflow-lint=${{ needs.workflow-lint.result }}"; do
            name="${r%%=*}"; result="${r#*=}"
            if [ "$result" != "success" ]; then echo "::error::$name -> $result"; failed=1; fi
          done
          [ "$failed" -eq 0 ] && echo "All CI checks passed!"
          exit "$failed"
