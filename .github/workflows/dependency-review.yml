name: Dependency Review

# 职责边界（与其它工具不重叠）：
#   Dependency Review = 这个 PR 有没有把新的危险依赖带进来（只审查**变化**）
#   Dependabot        = 当前依赖树里已有哪些已知漏洞（基线监控）
#   Bandit / CodeQL   = 代码层面的静态分析
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read        # 只读即可：不往 PR 写评论，结果由 job summary 表达

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # 只阻断 high 及以上：单人项目不该因为一个 low 级 advisory 就卡住 PR。
          # 较低等级交由 Dependabot 持续跟踪。
          fail-on-severity: high
          # 默认只查 runtime scope。但本仓库 6 个 high 里 4 个源自 devDependency
          # （@vue/eslint-config-typescript 那条链）—— 开发依赖同样会在本地与 CI 里
          # 执行（postinstall / 构建工具），不属于可以忽略的类别。
          # 已实测：默认 scope 下 dev 依赖的漏洞会被放行，加上 development 才会拦。
          fail-on-scopes: runtime, development
          # 不启 license 检查：仓库目前没有明确的许可证策略，
          # 没有规则的门禁只是"看起来专业"的噪音。
          license-check: false
          # 两个「无补丁版本」的公告：版本升级永远解决不了，故显式豁免并写明理由。
          # 这是 allow-list 的标准用途（记录在案的例外），不是关掉门禁 ——
          # 其它任何 high+ 的新增依赖仍会阻断（已实测，见 PR #124 的验证）。
          #
          #   GHSA-vfj7-8cjw-p6xm  braces <= 3.0.3 —— 深度嵌套导致栈耗尽的 DoS
          #     braces 的**最新版就是 3.0.3**，官方无修复版本。它经
          #     micromatch ← fast-glob 进入 eslint 工具链，只在构建/lint 期使用，
          #     不进入运行时产物。
          #
          #   GHSA-5ff8-jcf9-fw62  markdown-it-katex —— XSS
          #     包已停止维护、无修复版本。但本仓库的渲染输出**先经
          #     DOMPurify.sanitize() 再 v-html**（src/components/common/Markdown.vue:47,2），
          #     该 XSS 已被缓解。若要彻底移除，可换用维护中的
          #     @vscode/markdown-it-katex（尚未做，记为待办）。
          allow-ghsas: GHSA-vfj7-8cjw-p6xm, GHSA-5ff8-jcf9-fw62
